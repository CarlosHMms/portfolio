spring.application.name=orcAPI

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/orcDb
spring.datasource.username=orcBoss
spring.datasource.password=orcboss

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.jdbc.dialect=postgresql
spring.jooq.sql-dialect=postgreSQL82Dialect
